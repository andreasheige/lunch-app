name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  schedule:
    # Weekdays 10:00 CEST / 09:00 CET, so Poppels' captured menu follows the week (see scripts/capture.ts).
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  # build.ts asks GitHub which pull request each commit came from, to group the news by release.
  pull-requests: read
  # A restaurant whose menu could not be read gets an issue.
  issues: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: build.ts reads git log for the release notes.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Poppels' Canva menu sits behind a Cloudflare bot check only a headed browser passes; a failed
      # capture leaves its card on the Canva embed instead of failing the deploy.
      - run: npx playwright install --with-deps chromium && xvfb-run -a node scripts/capture.ts
        continue-on-error: true
      - run: npm run build
        env:
          GH_TOKEN: ${{ github.token }}
      # One open issue per restaurant whose menu failed (build-failures.json; weekends have no restaurants), unless
      # the live site read it fine: then the site answered this runner badly once and there is nothing to fix.
      # Never fails the deploy.
      - name: Open issues for menus that could not be read
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --state open --limit 500 --json title --jq '.[].title')
          live=$(curl -fsS --max-time 30 https://lunchit.se/lunch.json || echo '{}')
          date=$(jq -r .date dist/lunch.json)
          jq -c '.[]' build-failures.json |
            while read -r failure; do
              id=$(jq -r .id <<< "$failure")
              name=$(jq -r --arg id "$id" '.restaurants[] | select(.id == $id) | .name' dist/lunch.json)
              if jq -e --arg id "$id" --arg d "$date" \
                '.date == $d and any(.restaurants[]?; .id == $id and ((.dishes | length) > 0 or .embed))' <<< "$live" >/dev/null; then
                echo "$name: failed here but the live site has its menu; no issue"
                continue
              fi
              title="Fel: menyn för $name kunde inte läsas"
              if grep -Fxq "$title" <<< "$open"; then continue; fi
              jq -r --arg d "$date" --arg name "$name" --arg run "$RUN_URL" '
                "\($d): \(.error)\n\nByggsteget kunde inte läsa menyn för \($name), och inte heller lunchit.se har den just nu.\n\n" +
                "Sida: \(.url)\nHTTP-status: \(.status // "ingen")\nBygge: \($run)\n\nSidans text (början):\n\n```\n" +
                (.excerpt | gsub("`"; "´")) + "\n```\n\nUppdatera fixturen med `htmlToLines` och rätta parsern (se CLAUDE.md).\n"' <<< "$failure" |
                gh issue create --title "$title" --label bug --body-file -
            done
      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
